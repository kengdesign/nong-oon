name: Foundation tests
on:
  push:
    branches: [main, feat/mvp-foundation]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Node ${{ matrix.node }} / Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify built-in SQLite support
        run: node --input-type=module -e "import { DatabaseSync, backup } from 'node:sqlite'; if (typeof DatabaseSync !== 'function' || typeof backup !== 'function') process.exit(1);"
      # The project currently uses Node built-ins only; no npm install/cache.
      - run: npm run check
      - run: npm test
      - run: node scripts/check-phase2-fixtures.mjs
